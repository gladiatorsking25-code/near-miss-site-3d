<title>Near Miss Site 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Public+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app. The 3D site fills the stage; the scenario briefing sits beside it (below it on phones). One deliberate light look that matches the campaign deck. */
:root{
  --navy:#13293D; --navy-2:#1E3A55; --orange:#E8772E; --orange-ink:#B5520F;
  --paper:#F6F4EF; --card:#FFFFFC; --line:#DDE3E8; --muted:#4A5563; --safe:#2E7D4F; --safe-bg:#E6F2EA; --risk-bg:#FCEEE4;
  --display:"Oswald","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--navy);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--navy);color:#fff}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.score{font-size:13px;color:#cfd8e1;display:flex;align-items:center;gap:8px}
.score b{color:#fff;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:#33506b}.dots i.on{background:var(--orange)}
.mode{margin-left:auto;display:flex;background:var(--navy-2);border-radius:999px;padding:4px;gap:4px}
.mode button{font:600 14px var(--body);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:transparent;color:#cfd8e1}
.mode button[aria-pressed="true"].haz{background:var(--orange);color:#fff}
.mode button[aria-pressed="true"].fix{background:var(--safe);color:#fff}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;min-height:0;background:#DCE6EE}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--orange);color:#fff;font:700 15px var(--body);cursor:pointer;box-shadow:0 2px 6px rgba(19,41,61,.35);display:grid;place-items:center;transition:transform .15s}
.pin.seen::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--navy)}
.pin.fixed{background:var(--safe)}
.pin.active{transform:translate(-50%,-50%) scale(1.22);border-color:var(--navy)}
.stagebar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.hint{background:rgba(19,41,61,.85);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px}
.reset{pointer-events:auto;font:600 12px var(--body);background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
aside{width:400px;max-width:100%;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.detail{padding:18px 20px 12px;overflow-y:auto;flex:1;min-height:0}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;color:#fff;background:var(--orange)}
.pill.ok{background:var(--safe)}
.pill.sev{background:#fff;color:#A3291C;box-shadow:inset 0 0 0 1px #E3B5AE}
h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;margin:8px 0 12px;text-wrap:balance}
.box{border-radius:8px;padding:12px 14px;margin:0 0 12px}
.box.risk{background:var(--risk-bg)}
.box.safe{background:var(--safe-bg)}
.lbl{font-size:12px;font-weight:700;margin:0 0 4px;color:var(--orange-ink)}
.safe .lbl{color:var(--safe)}
.box p,.sec p{margin:0;font-size:14px;line-height:1.5;color:var(--navy)}
.sec{margin:0 0 12px}
.sec .lbl{color:var(--navy)}
ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted)}
.safe ul{color:var(--navy)}
li+li{margin-top:2px}
.ask{border-left:0;background:var(--paper);border-radius:8px;padding:10px 14px;font-size:14px;line-height:1.5;color:var(--navy)}
.ask b{display:block;font-size:12px;color:var(--orange-ink);margin-bottom:2px}
.kv{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.6fr);gap:4px 10px;font-size:13px;line-height:1.45;margin:0 0 12px}
.kv dt{font-weight:700;color:var(--navy)}.kv dd{margin:0;color:var(--muted)}
.act{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4;margin:2px 0 0}
.act td{padding:5px 6px 5px 0;vertical-align:top;border-top:1px solid rgba(19,41,61,.1);color:var(--navy)}
.act td.who{color:var(--muted);white-space:nowrap;font-size:12px}
.act tr:first-child td{border-top:0}
.g2{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px;background:#fff}
.g2 .lbl{color:var(--navy)}.g2 .sub{font-size:11px;color:var(--muted);margin:0 0 8px}
.risk3{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 0}.risk3 span{font-size:12px;background:var(--paper);border-radius:6px;padding:3px 8px;color:var(--navy)}
.who-card{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-size:13px;color:var(--muted)}.who-card b{color:var(--navy)}
.reset.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.intro p{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 10px}
.intro ol{margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.6;color:var(--navy)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;color:var(--muted);align-items:center}
.legend .d{width:14px;height:14px;border-radius:50%}
.nav{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--line)}
.nav button{flex:1;font:600 14px var(--body);border-radius:8px;padding:9px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--navy)}
.nav button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 20px 12px}
.chip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 13px var(--body);border:1px solid var(--line);background:var(--paper);color:var(--navy);border-radius:8px;padding:7px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chip .n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px}
.chip.fixed .n{background:var(--safe)}
.chip.seen{background:#fff}
.chip[aria-current="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.foot{font-size:11px;color:var(--muted);padding:0 20px 12px}
@media (max-width:820px){
  main{flex-direction:column}
  #stage{flex:none;height:48%}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  h1{font-size:19px}.eyebrow{display:none}
  .mode{margin-left:0}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>

<header>
  <div class="brand">
    <span class="eyebrow">Near Miss Campaign 2026 · Spot it, report it, fix it</span>
    <h1>Near Miss Site 3D</h1>

</main>

miss to the supervisor or HSE in the same shift; HSE records it on ADOSH-SF Form G2."], "risk": {"probability": "Rare", "severity": "Major", "level": "Moderate"}, "description": "On 20/10/2026 at 08:10, during a planned HSE site inspection of the benched excavation (Zone A), a section of edge protection was found removed and a worker was standing at the open edge passing tools down by hand. A slip or loss of balance could have resulted in a fall of about 2 m into the excavation. No injury occurred. Work was stopped and the area made safe immediately."}, {"n": 2, "ref": "16124-NM-SAMPLE-02", "time": "08:25", "title": "Worker inside the excavator's swing", "category": "People and plant – struck by moving plant", "location": "Excavation area beside the trench (Zone B)", "observed": "A worker was walking along the trench inside the swing radius of a working excavator. The operator was looking at the bucket and had not seen him. No exclusion zone or banksman was in place.", "potential": "Worker struck or crushed by the counterweight or bucket.", "unsafe_acts": ["Improper position for task", "Failure to warn", "Lack of awareness / knowledge"], "unsafe_conditions": ["Inadequate guards or barriers", "Inadequate warning system or notice"], "root_personal": ["Skill Level"], "root_system": ["Inadequate Risk Assessment / Management", "Inadequate Leadership Supervision"], "immediate_actions": [["Operator stopped the excavator and lowered the bucket; worker escorted out of the swing zone.", "HSE Officer", "20/10/2026"], ["Exclusion zone (swing radius plus 1 m) marked with cones and barrier tape.", "Site Supervisor", "20/10/2026"], ["Trained banksman posted in the operator's line of sight before work resumed.", "Foreman", "20/10/2026"]], "root_causes": ["No exclusion zone set up around the working excavator.", "No banksman assigned for excavation work near pedestrians.", "Pedestrian route ran past the digging area."], "corrective_actions": [["Exclusion zone and banksman added as permanent controls in the excavation method statement and risk assessment.", "Site Engineer", "22/10/2026"], ["Pedestrian route moved away from the digging area and signed.", "Site Supervisor", "21/10/2026"], ["Toolbox talk for operators and workers: never enter the swing zone without eye contact and a signal from the operator.", "HSE Officer", "21/10/2026"]], "procedure": ["Plant and pedestrian segregation as per the site traffic management plan.", "Exclusion zone of the swing radius plus 1 m around working excavators.", "Banksman required whenever people work near operating plant.", "Operator stops and grounds the bucket before anyone enters the zone."], "risk": {"probability": "Rare", "severity": "Catastrophic", "level": "Moderate"}, "description": "On 20/10/2026 at 08:25, during a planned HSE site inspection, a worker was observed walking inside the swing radius of an excavator while it was digging beside the trench (Zone B). The operator was not aware of him. No exclusion zone was marked and no banksman was present. No injury occurred. The HSE Officer signalled the operator to stop and the worker was escorted out of the zone."}, {"n": 3, "ref": "16124-NM-SAMPLE-03", "time": "08:40", "title": "Shoring strut missing in the trench", "category": "Excavation – trench collapse", "location": "Shored trench, east side (Zone C)", "observed": "One horizontal strut was missing from the trench shoring and spoil was heaped at the trench edge while a worker was inside the trench.", "potential": "Trench wall collapse burying or crushing the worker.", "unsafe_acts": ["Removing / Defeating Safety Devices", "Failure to secure", "Lack of awareness / knowledge"], "unsafe_conditions": ["Inadequate guards or barriers", "Poor housekeeping, disorder"], "root_personal": ["Skill Level"], "root_system": ["Inadequate Planned Inspections", "Inadequate Management of Change"], "immediate_actions": [["Worker removed from the trench and entry stopped.", "HSE Officer", "20/10/2026"], ["Missing strut refitted and shoring checked by the competent person.", "Site Engineer", "20/10/2026"], ["Spoil moved back from the trench edge; ladder placed within reach.", "Site Supervisor", "20/10/2026"]], "root_causes": ["Strut removed to pass a pipe through and not refitted.", "Trench not re-inspected after the change to the support system.", "Spoil placement not controlled."], "corrective_actions": [["Trench to be inspected and recorded by a competent person before each shift and after any change.", "Site Engineer", "21/10/2026"], ["Any change to shoring to be approved by the site engineer; no entry until it is reinstated.", "Site Engineer", "21/10/2026"], ["Spoil and material storage distance from the edge marked on site and briefed to the team.", "Site Supervisor", "22/10/2026"]], "procedure": ["Excavation permit to work, including the trench support design and method statement.", "Competent person inspection before each shift and after any change; entry only when signed off.", "Spoil and materials kept back from the edge as set in the method statement.", "Safe ladder access within reach of anyone working in the trench."], "risk": {"probability": "Rare", "severity": "Catastrophic", "level": "Moderate"}, "description": "On 20/10/2026 at 08:40, during a planned HSE site inspection of the shored trench (Zone C), one shoring strut was found missing and excavated spoil was heaped at the trench edge while a worker was in the trench. This increased the load on the trench wall and reduced the support. No collapse or injury occurred. The worker was asked to leave the trench immediately."}, {"n": 4, "ref": "16124-NM-SAMPLE-04", "time": "08:55", "title": "Worker under the crane's load", "category": "Lifting operations – struck by suspended load", "location": "Mobile crane lifting area (Zone D)", "observed": "A mobile crane was lifting a bundle of steel beams. A worker took a shortcut and walked under the suspended load. The lift zone was not barricaded and no tag line was used.", "potential": "Worker struck by the load, a slipping beam or a failed sling.", "unsafe_acts": ["Violation / taking shortcuts", "Improper position for task"], "unsafe_conditions": ["Inadequate guards or barriers", "Inadequate warning system or notice"], "root_personal": ["Behavior"], "root_system": ["Inadequate / Missing Work Procedures (SoP)", "Inadequate Communication"], "immediate_actions": [["Lift stopped by the signaller and the load landed safely.", "Lifting Supervisor", "20/10/2026"], ["Lift zone barricaded with cones and tape; lookout posted.", "Site Supervisor", "20/10/2026"], ["Tag lines fitted to control the load before the lift restarted.", "Rigger / Signaller", "20/10/2026"]], "root_causes": ["Lift zone not set up as required by the lift plan.", "Lift plan not briefed to workers near the lift.", "Worker chose a shortcut under the load."], "corrective_actions": [["Lift plan briefing to include all workers in the area, with sign-off before each lift.", "Lifting Supervisor", "21/10/2026"], ["Barricaded lift zone and tag lines added as mandatory checks on the lifting permit.", "Site Engineer", "21/10/2026"], ["Toolbox talk: never walk under a suspended load.", "HSE Officer", "21/10/2026"]], "procedure": ["Approved lift plan and lifting permit for every crane lift.", "Certified crane operator, rigger and signaller; lift zone barricaded with a lookout.", "Tag lines to control the load; no one under or near a suspended load.", "Pre-lift briefing for everyone working nearby."], "risk": {"probability": "Rare", "severity": "Catastrophic", "level": "Moderate"}, "description": "On 20/10/2026 at 08:55, during a planned HSE site inspection, a worker was observed walking under a suspended load of steel beams during a mobile crane lift (Zone D). The lift zone was not barricaded and the load had no tag line. No injury occurred. The lift was stopped and the load lowered in a safe position."}, {"n": 5, "ref": "16124-NM-SAMPLE-05", "time": "09:10", "title": "Truck reversing toward a pedestrian", "category": "Moving plant – reversing vehicle", "location": "Plant and vehicle area (Zone E)", "observed": "A dumper was reversing in the plant area toward a worker walking behind it. A colleague shouted and the worker stepped aside just in time. There was no pedestrian walkway and no banksman.", "potential": "Worker run over or crushed against parked plant.", "unsafe_acts": ["Failure to warn", "Improper position for task", "Lack of attention / concentration"], "unsafe_conditions": ["Congestion/ restricted action/ poor access", "Excessive noise exposure"], "root_personal": ["Human Error"], "root_system": ["Inadequate Engineering / Design / Controls", "Inadequate Risk Assessment / Management"], "immediate_actions": [["Vehicle movements in the plant area stopped.", "HSE Officer", "20/10/2026"], ["Barriered pedestrian walkway set up along the plant area.", "Site Supervisor", "20/10/2026"], ["Banksman assigned for all reversing moves; reversing alarm and camera checked.", "Plant Foreman", "20/10/2026"]], "root_causes": ["No segregation between pedestrians and plant in the plant area.", "Reversing moves made without a banksman.", "Reversing alarm hard to hear over site noise."], "corrective_actions": [["Traffic management plan updated with a permanent segregated walkway in the plant area.", "Site Engineer", "23/10/2026"], ["Banksman mandatory for all reversing; added to the daily plant pre-use checklist.", "Plant Foreman", "21/10/2026"], ["Toolbox talk: make eye contact with the driver before passing plant.", "HSE Officer", "21/10/2026"]], "procedure": ["Site traffic management plan with segregated pedestrian and plant routes.", "Banksman for every reversing movement.", "Daily pre-use check of reversing alarm, camera and mirrors.", "Pedestrians make eye contact with the driver before passing."], "risk": {"probability": "Rare", "severity": "Catastrophic", "level": "Moderate"}, "description": "On 20/10/2026 at 09:10, during a planned HSE site inspec const ep=grp(-19.2,0,9); ep.rotation.y=Math.PI/2;
box(1.1,1.9,0.6,0xC62828,0,0.95,0,ep); box(1.3,0.12,0.8,0xC62828,0,1.95,0,ep);
cyl(0.16,0.16,0.7,0xD32F2F,-0.25,0.55,0.35,ep); cyl(0.16,0.16,0.7,0xD32F2F,0.25,0.55,0.35,ep);
board(0.9,0.5,["FIRE POINT","FIRST AID"],"#C62828","#fff",0,1.5,0.32,ep);
const nopark=onlyIn("fix",grp()); 
box(2.2,0.05,0.12,0xF2C230,-17.6,0.06,7.9,nopark); box(2.2,0.05,0.12,0xF2C230,-17.6,0.06,10.1,nopark); box(0.12,0.05,2.2,0xF2C230,-16.5,0.06,9,nopark);
for(let i=0;i<5;i++){const t=box(1.2,0.05,0.1,0xF2C230,-18.4+i*0.42,0.065,9,nopark);t.rotation.y=0.8;}
const truck=grp(); box(4,1.7,2,0xE6E9EC,-0.6,1.35,0,truck); box(1.4,1.4,1.9,0x1565C0,2,1.1,0,truck); box(0.05,0.6,1.6,0x8fc1e3,2.71,1.4,0,truck);
[[-2,-0.95],[-2,0.95],[-0.4,-0.95],[-0.4,0.95],[2,-0.95],[2,0.95]].forEach(([x,z])=>{wheel(x,0.42,z,0.42,0.3,truck);});
truck.rotation.y=Math.PI/2; T(truck,[-17.4,9.2],[-14.6,12]);

curS=-1;
// ---------- UI ----------
const pinsEl=document.getElementById("pins"),chipsEl=document.getElementById("chips"),detail=document.getElementById("detail"),dotsEl=document.getElementById("dots");
const dots=S.map(()=>{const i=document.createElement("i");dotsEl.appendChild(i);return i;});
const pins=S.map((s,i)=>{const b=document.createElement("button");b.className="pin";b.textContent=i+1;b.setAttribute("aria-label",`${i+1}. ${s.name}`);b.onclick=()=>select(i);pinsEl.appendChild(b);return b;});

const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

let insp=null;
const sm=i=>insp?(insp.fixed.has(i)?"fix":"haz"):mode;
function applyMode(){
  showIn.haz.forEach(o=>o.visible=sm(o.userData.s)==="haz"); showIn.fix.forEach(o=>o.visible=sm(o.userData.s)==="fix");
  document.getElementById("btnHaz").setAttribute("aria-pressed",mode==="haz");
  document.getElementById("btnFix").setAttribute("aria-pressed",mode==="fix");
  pins.forEach((p,i)=>p.classList.toggle("fixed",sm(i)==="fix")); chips.forEach((c,i)=>c.classList.toggle("fixed",sm(i)==="fix"));
  render();
}
let camGoal=null;
function fly(t,c){camGoal={t:new THREE.Vector3(...t),c:new THREE.Vector3(...c)};}
function select(i){
  if(insp)return;
  current=i; seen.add(i);
  pins.forEach((p,k)=>{p.classList.toggle("active",k===i);p.classList.toggle("seen",seen.has(k));});
  chips.forEach((c,k)=>{c.setAttribute("aria-current",k===i);c.classList.toggle("seen",seen.has(k));});
  dots.forEach((d,k)=>d.classList.toggle("on",seen.has(k))); document.getElementById("seenN").textContent=seen.size;
  const s=S[i]; fly([s.pos[0],0.5,s.pos[2]],[s.pos[0]+s.cam[0],s.cam[1],s.pos[2]+s.cam[2]]);
  render();
}
function render(){
  if(insp)return renderInsp();
  const prev=document.getElementById("prev"),next=document.getElementById("next");
  prev.disabled=current<=0; prev.style.visibility=current<0?"hidden":"visible";
  next.textContent=current<0?"Start tour":current===S.length-1?"Back to whole site":"Next near miss";
  if(current<0){
    detail.innerHTML=`<div class="intro"><span class="tag">Practical demonstration</span><h2>Spot the near miss</h2>
    <p>This site has eight near misses waiting to happen. Look around the site first and try to find them all before you tap a number.</p>
    <ol><li><b>Spot it:</b> find what is wrong on the site</li><li><b>Report it:</b> tell your supervisor or HSE in the same shift</li><li><b>Fix it:</b> switch to “Show fixes” to see the control in place</li></ol>
    <p style="margin-top:4px">Or press <b>Inspection walk</b> to follow Sabir, HSE Officer, as he inspects the site, corrects each near miss and records it on ADOSH-SF Form G2.</p><div class="legend"><span class="d" style="background:var(--orange)"></span><span>Near miss to find</span><span class="d" style="background:var(--safe)"></span><span>Control in place (Show fixes)</span><span class="d" style="background:#fff;box-shadow:inset 0 0 0 3px var(--navy)"></span><span>Already looked at</span></div></div>`;
    return;
  }
  const s=S[current],fix=mode==="fix";
  detail.innerHTML=`<div class="tagrow"><span class="tag">${current+1} of 8 · ${esc(s.tag)}</span><span class="pill ${fix?"ok":""}">${fix?"Fixed":"Near miss"}</span>${fix?"":`<span class="pill sev">${esc(s.sev)}</span>`}</div>
  <h2>${esc(s.name)}</h2>
  ${fix?`<div class="box safe"><p class="lbl">Controls now in place</p>${li(s.fix)}</div><div class="sec"><p class="lbl">The near miss was</p><p>${esc(s.hap)}</p></div>`
  :`<div class="box risk"><p class="lbl">What happened</p><p>${esc(s.hap)}</p></div>
  <div class="sec"><p class="lbl">Could have been</p><p>${esc(s.could)}</p></div>
  <div class="sec"><p class="lbl">Why it happened</p>${li(s.why)}</div>
  <div class="box safe"><p class="lbl">How to prevent it</p>${li(s.fix)}</div>`}
  <div class="sec"><p class="lbl">Report it</p><p>Stop and make safe, then tell your supervisor or HSE in the same shift. A photo is enough. HSE records it on ADOSH-SF Form G2.</p></div>
  <div class="ask"><b>Ask the group</b>${esc(s.ask)}</div>`;
}
document.getElementById("btnHaz").onclick=()=>{if(insp)inspEnd(false);mode="haz";applyMode();};
document.getElementById("btnFix").onclick=()=>{if(insp)inspEnd(false);mode="fix";applyMode();};
document.getElementById("next").onclick=()=>{if(insp)return inspNextBtn();if(current===S.length-1){home();}else select(current+1);};
document.getElementById("prev").onclick=()=>{if(insp)return inspEnd(true);if(current>0)select(current-1);};
function home(){current=-1;pins.forEach(p=>p.classList.remove("active"));chips.forEach(c=>c.setAttribute("aria-current",false));fly([0,0,0],[-24,28,32]);render();}
document.getElementById("reset").onclick=()=>{if(insp)inspEnd(false);home();};
// ---------- inspection walk: Sabir visits each near miss, corrects it and records it ----------
const SB_HOME=[15.6,-5.3,-0.35];
const ROUTE=[
 {path:[[-7.0,-5.2]],face:[-9.6,-5.6]},
 {path:[[4.75,-5.2],[4.75,0.6],[2.0,1.8],[-2.0,1.8],[-2.4,0.4]],face:[-6.3,5.6]},
 {path:[[-2.0,1.8],[2.0,1.8],[2.2,0.6],[8.4,0.8]],face:[8,5]},
 {path:[[5.6,0.5],[3.0,0.9]],face:[3.4,4]},
 {path:[[5.6,0.5],[11.2,0.5]],face:[13.4,3.9]},
 {path:[[4.75,0.6],[4.75,-5.2],[-4.2,-5.2]],face:[-6,-2.4]},
 {path:[[-12.8,-5.2],[-12.8,0.6],[-14.4,1.2],[-14.2,5.4]],face:[-10.5,5.6]},
 {path:[[-15.2,7.4]],face:[-19.2,9]}];
const ZONE=["the benched excavation","the excavator and cable trench","the shored trench","the crane lift","the plant area","the site road","the cable trench","the fire point and first aid station"];
let walkPh=0, faceTo=null;
function inspStart(){insp={i:0,phase:"walk",fixed:new Set(),path:[]};sabir.position.set(SB_HOME[0],0,SB_HOME[1]);sabir.rotation.y=SB_HOME[2];
  current=-1;pins.forEach(p=>p.classList.remove("active"));applyMode();inspGo(0);}
function inspGo(i){insp.i=i;insp.phase="walk";insp.path=ROUTE[i].path.map(p=>p.slice());faceTo=null;
  pins.forEach((p,k)=>p.classList.toggle("active",k===i));chips.forEach((c,k)=>c.setAttribute("aria-current",k===i));
  if(reduce){const q=insp.path[insp.path.length-1];sabir.position.set(q[0],0,q[1]);insp.path=[];inspArrive();}else renderInsp();}
function inspArrive(){const i=insp.i,s=S[i],f=ROUTE[i].face;insp.phase="found";faceTo=Math.atan2(f[0]-sabir.position.x,f[1]-sabir.position.z);
  seen.add(i);dots.forEach((d,k)=>d.classList.toggle("on",seen.has(k)));document.getElementById("seenN").textContent=seen.size;
  pins.forEach((p,k)=>p.classList.toggle("seen",seen.has(k)));chips.forEach((c,k)=>c.classList.toggle("seen",seen.has(k)));
  const mx=(sabir.position.x+s.pos[0])/2,mz=(sabir.position.z+s.pos[2])/2;fly([mx,0.8,mz],[mx+s.cam[0]*0.95,s.cam[1]*0.95,mz+s.cam[2]*0.95]);renderInsp();}
function inspNextBtn(){if(insp.phase==="walk"){const q=insp.path[insp.path.length-1];if(q){sabir.position.set(q[0],0,q[1]);insp.path=[];inspArrive();}return;}
  if(insp.phase==="found"){insp.fixed.add(insp.i);insp.phase="fixed";applyMode();return;}
  if(insp.phase==="fixed"){if(insp.i<S.length-1)inspGo(insp.i+1);else{insp.phase="done";fly([0,0,0],[-24,28,32]);renderInsp();}return;}
  inspEnd(true);}
function inspEnd(goHome){insp=null;faceTo=null;sabir.position.set(SB_HOME[0],0,SB_HOME[1]);sabir.rotation.y=SB_HOME[2];
  sabir.userData.legs.forEach(l=>l.rotation.x=0);applyMode();if(goHome)home();}
function inspStep(dt){
  const lg=sabir.userData.legs, arm=sabir.userData.arm;
  if(insp&&insp.phase==="walk"&&insp.path.length){
    const [tx,tz]=insp.path[0],dx=tx-sabir.position.x,dz=tz-sabir.position.z,d=Math.hypot(dx,dz);
    if(d<0.03){insp.path.shift();if(!insp.path.length)inspArrive();}
    else{const st=Math.min(d,dt*2.4*(window.WALK||1));sabir.position.x+=dx/d*st;sabir.position.z+=dz/d*st;walkPh+=st*4.2;
      let a=Math.atan2(dx,dz)-sabir.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));sabir.rotation.y+=a*Math.min(1,dt*8);
      lg[0].rotation.x=Math.sin(walkPh)*0.5;lg[1].rotation.x=-Math.sin(walkPh)*0.5;arm.rotation.x=-0.15+Math.sin(walkPh)*0.3;
      const x=sabir.position.x,z=sabir.position.z;camGoal={t:new THREE.Vector3(x,1.2,z),c:new THREE.Vector3(x+5,7.5,z+8)};}
  }else{lg.forEach(l=>l.rotation.x*=0.85);arm.rotation.x+=(-0.15-arm.rotation.x)*0.15;
    if(faceTo!=null){let a=faceTo-sabir.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));sabir.rotation.y+=a*Math.min(1,dt*6);}}
}
const tdl=(rows,who=true)=>`<table class="act">${rows.map(r=>`<tr><td>${esc(r[0])}</td>${who?`<td class="who">${esc(r[1])}${r[2]?`<br>${esc(r[2])}`:""}</td>`:""}</tr>`).join("")}</table>`;
function renderInsp(){
  const prev=document.getElementById("prev"),next=document.getElementById("next");
  prev.disabled=false;prev.style.visibility="visible";prev.textContent="End inspection";
  const who=`<div class="who-card"><span>Inspected by <b>Sabir Amin, HSE Officer</b> · 20/10/2026</span></div>`;
  if(insp.phase==="done"){next.textContent="Back to whole site";
    detail.innerHTML=`<div class="tagrow"><span class="tag">Site inspection · complete</span><span class="pill ok">8 of 8 closed</span></div><h2>Inspection summary</h2>${who}
    <p class="sub" style="font-size:13px;color:var(--muted);margin:0 0 10px">Eight near misses identified, made safe, corrected and recorded on ADOSH-SF Form G2 as per Mechanism 11.0.</p>
    <table class="act">${INSP.map(r=>`<tr><td><b>${r.n}.</b> ${esc(r.title)}<br><span style="color:var(--muted);font-size:12px">${esc(r.ref)} · ${esc(r.time)}</span></td><td class="who">Residual risk: ${esc(r.risk.level)}<br>Closed</td></tr>`).join("")}</table>
    <div class="ask" style="margin-top:12px"><b>Remember</b>See it. Report it. Prevent it. A near miss reported today is an injury prevented tomorrow.</div>`;return;}
  const r=INSP[insp.i],s=S[insp.i];
  const head=(pill,cls)=>`<div class="tagrow"><span class="tag">Site inspection · stop ${insp.i+1} of 8</span><span class="pill ${cls}">${pill}</span></div>`;
  if(insp.phase==="walk"){next.textContent="Skip walk";
    detail.innerHTML=`${head("Walking","sev")}<h2>Walking to ${esc(ZONE[insp.i])}</h2>${who}
    <div class="sec"><p class="lbl">What Sabir checks on the way</p><ul><li>Uses the pedestrian route and zebra crossings</li><li>Keeps out of plant swing and lift zones</li><li>Looks for unsafe acts and unsafe conditions</li></ul></div>`;return;}
  if(insp.phase==="found"){next.textContent="Correct it";
    detail.innerHTML=`${head("Near miss identified","")}<h2>${esc(r.title)}</h2>${who}
    <div class="box risk"><p class="lbl">Observed at ${esc(r.time)} · ${esc(r.location)}</p><p>${esc(r.observed)}</p></div>
    <dl class="kv"><dt>Hazard type</dt><dd>${esc(r.category)}</dd><dt>Form G2 incident type</dt><dd>Near-miss</dd><dt>Could have been</dt><dd>${esc(r.potential)}</dd>
    <dt>Unsafe act</dt><dd>${esc(r.unsafe_acts.join("; "))}</dd><dt>Unsafe condition</dt><dd>${esc(r.unsafe_conditions.join("; "))}</dd>
    <dt>Root cause (personal)</dt><dd>${esc(r.root_personal.join("; "))}</dd><dt>Root cause (system)</dt><dd>${esc(r.root_system.join("; "))}</dd></dl>
    <div class="ask"><b>First action</b>Stop the work and make the area safe before anything else.</div>`;return;}
  next.textContent=insp.i<S.length-1?"Walk to next near miss":"Finish inspection";
  detail.innerHTML=`${head("Corrected","ok")}<h2>${esc(r.title)}</h2>${who}
  <div class="box safe"><p class="lbl">Immediate actions taken</p>${tdl(r.immediate_actions)}</div>
  <div class="sec"><p class="lbl">Procedure to follow</p>${li(r.procedure)}</div>
  <div class="sec"><p class="lbl">Root causes</p>${li(r.root_causes)}</div>
  <div class="sec"><p class="lbl">Corrective actions to prevent recurrence</p>${tdl(r.corrective_actions)}</div>
  <div class="g2"><p class="lbl">ADOSH-SF Form G2 record (sample)</p><p class="sub">Recorded as per Mechanism 11.0 · for training</p>
   <dl class="kv"><dt>Report no.</dt><dd>${esc(r.ref)}</dd><dt>Date and time</dt><dd>20/10/2026 · ${esc(r.time)}</dd><dt>Incident type</dt><dd>☒ Near-miss</dd>
   <dt>Location on site</dt><dd>${esc(r.location)}</dd><dt>Description</dt><dd>${esc(r.description)}</dd><dt>Injured person</dt><dd>None (N/A)</dd>
   <dt>Residual risk</dt><dd><div class="risk3"><span>Probability: ${esc(r.risk.probability)}</span><span>Severity: ${esc(r.risk.severity)}</span><span>Level: ${esc(r.risk.level)}</span></div></dd>
   <dt>Status</dt><dd>Closed – Completed</dd><dt>Reported by</dt><dd>Sabir Amin, HSE Officer</dd></dl></div>`;
}
document.getElementById("fsBtn").onclick=()=>{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen();};
// presenter keys: arrows step through, I starts the inspection walk, H shows the whole site, F toggles full screen
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea,select"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){document.getElementById("next").click();e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){const b=document.getElementById("prev");if(!b.disabled&&b.style.visibility!=="hidden")b.click();e.preventDefault();}
  else if(e.key==="i"||e.key==="I")document.getElementById("inspBtn").click();
  else if(e.key==="h"||e.key==="H")document.getElementById("reset").click();
  else if(e.key==="f"||e.key==="F")document.getElementById("fsBtn").click();});
document.getElementById("inspBtn").onclick=()=>{if(insp)inspEnd(false);inspStart();};

document.getElementById("meet").onclick=()=>fly([15.6,1.9,-5.3],[14.7,2.5,-2.7]);

function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(r.height,1);camera.fov=camera.aspect<1?58:40;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();
controls.addEventListener("start",()=>{camGoal=null;});

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const v=new THREE.Vector3();
(function loop(){
  requestAnimationFrame(loop);
  const k=reduce?1:0.08, t=performance.now()/1000; const dt=Math.min(0.05,t-(loop.t||t)); loop.t=t;
  inspStep(dt);
  tween.forEach(q=>{const to=q[sm(q.s)];q.o.position.x+=(to[0]-q.o.position.x)*k;q.o.position.z+=(to[1]-q.o.position.z)*k;});
  if(camGoal){controls.target.lerp(camGoal.t,k);camera.position.lerp(camGoal.c,k);if(camera.position.distanceTo(camGoal.c)<0.05)camGoal=null;}
  if(!reduce){
    house.rotation.y=sm(1)==="haz"?Math.sin(t*0.6)*0.5:0;
    flagMeshes.forEach((m,i)=>{m.rotation.y=Math.sin(t*1.6+i)*0.25;});
    sabir.userData.head.rotation.y=Math.sin(t*0.4)*0.35;
    bp.rotation.z+=((sm(6)==="fix"?-0.35:0.55)-bp.rotation.z)*0.08;
    loadG.rotation.y=sm(3)==="haz"?Math.sin(t*0.9)*0.35:0;
    dump.userData.beacon.material.emissive=new THREE.Color(Math.sin(t*8)>0?0xFF8F00:0x000000);
  }
  controls.update(); renderer.render(scene,camera);
  if(!loop.shown){loop.shown=1;const l=document.getElementById("loader");l.style.opacity=0;setTimeout(()=>l.remove(),450);}
  const r=stage.getBoundingClientRect();
  S.forEach((s,i)=>{v.set(...s.pos).project(camera);const p=pins[i];p.style.display=v.z<1?"grid":"none";p.style.left=((v.x+1)/2*r.width)+"px";p.style.top=((1-v.y)/2*r.height)+"px";});
})();
applyMode();
</script>
